[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "serena-shared-mcp"
version = "0.1.0"
description = "Shared on-demand Serena MCP server for Git checkouts"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Aaron Costley" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["mcp>=2.0.0,<3"]

[project.scripts]
serena-shared = "serena_shared.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/serena_shared"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["serena_shared"]

[tool.coverage.report]
show_missing = true
